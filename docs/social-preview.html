<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardumen Deck</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background:
          radial-gradient(circle at 12% 8%, rgba(34, 211, 238, 0.22), transparent 30%),
          radial-gradient(circle at 88% 92%, rgba(79, 70, 229, 0.28), transparent 34%),
          #080d18;
        color: #e2e8f0;
        font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
      }
      .shell {
        display: grid;
        grid-template-columns: 430px 1fr;
        gap: 48px;
        align-items: center;
        height: 100%;
        padding: 54px 58px;
      }
      .brand { display: flex; align-items: center; gap: 18px; }
      .brand img { width: 76px; height: 76px; border-radius: 20px; }
      .brand span {
        color: #94a3b8;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 28px 0 12px;
        font-size: 60px;
        line-height: 0.98;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        max-width: 390px;
        color: #a9b7cb;
        font-size: 22px;
        line-height: 1.45;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
      .chips span {
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.6);
        color: #cbd5e1;
        padding: 7px 11px;
        font-size: 13px;
        font-weight: 600;
      }
      .repo {
        margin-top: 32px;
        color: #67e8f9;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 14px;
      }
      .shot {
        position: relative;
        height: 520px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 24px;
        background: #0b1120;
        box-shadow: 0 40px 100px -40px rgba(0, 0, 0, 0.9);
      }
      .shot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: left top;
        opacity: 0.96;
      }
      .shot::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(8, 13, 24, 0.22), transparent 34%);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section>
        <div class="brand">
          <img src="assets/octopus.webp" alt="" />
          <span>Local-first</span>
        </div>
        <h1>Cardumen<br />Deck</h1>
        <p>Many services, one current. Un dashboard local para arrancar, monitorear y operar tus servicios de desarrollo.</p>
        <div class="chips">
          <span>Windows</span>
          <span>Tauri 2</span>
          <span>Vue 3</span>
          <span>Rust</span>
        </div>
        <div class="repo">github.com/DaniloGarrido/cardumen-deck</div>
      </section>
      <section class="shot">
        <img src="screenshots/dashboard.webp" alt="Cardumen Deck dashboard" />
      </section>
    </main>
  </body>
</html>
