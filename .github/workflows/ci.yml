name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Backend -> target

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm --workspace FrontEnd run lint

      - name: Type check
        run: npm --workspace FrontEnd run check

      - name: Build frontend
        run: npm --workspace FrontEnd run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path Backend/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path Backend/Cargo.toml --all-targets -- -D warnings

      - name: Test backend
        run: cargo test --manifest-path Backend/Cargo.toml --lib
